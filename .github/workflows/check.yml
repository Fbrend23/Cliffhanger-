# Vérification du site, sans le publier.
#
# À chaque poussée sur dev, le même build que le déploiement : une erreur
# de type, un loader qui refuse, une page qui ne se rend pas se voient ici,
# avant le fast-forward vers main, et non au moment de mettre en ligne. Pas
# de déclencheur pull_request : le flux ne passe pas par des PR (dev → main
# en fast-forward direct), ça doublerait juste le run pour rien.
# Rien n'est écrit nulle part : ni FTP, ni date dans le CMS.
#
# Le cache des images est lu mais jamais réécrit (actions/cache/restore) :
# la clé cliff-images-<run> est celle du déploiement, qui a la version la
# plus récente ; un build de vérification n'a pas à la remplacer.

name: Vérification

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Brussels
      SITE_URL: ${{ vars.SITE_URL }}
      DIRECTUS_URL: ${{ vars.DIRECTUS_URL }}
      DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
      PRODYSOS_URL: ${{ vars.PRODYSOS_URL }}
      PRODYSOS_KEY: ${{ secrets.PRODYSOS_KEY }}
      PRODYSOS_COMPANY: ${{ vars.PRODYSOS_COMPANY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tout l'historique : un secret commité puis retiré reste dans les anciens commits.
          fetch-depth: 0

      # Gitleaks cherche les secrets dans tous les commits. Binaire vérifié par
      # son empreinte, pas par la confiance dans un téléchargement.
      - name: Chercher des secrets dans l'historique
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact -v .
          rm gitleaks gitleaks.tar.gz

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      # Les deux workflows déploient en production : une erreur de syntaxe ou
      # d'expression ne doit pas attendre le prochain déploiement pour se voir.
      # Script de téléchargement épinglé par empreinte, version de l'outil fixée.
      - name: Contrôler les workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - run: npm ci --prefer-offline --no-audit --no-fund

      # Les dépendances livrées : une faille de gravité haute arrête la
      # vérification. Les outils de développement n'entrent pas dans le site
      # construit, d'où --omit=dev.
      - name: Auditer les dépendances
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/directus-assets
            node_modules/.astro
          key: cliff-images-verification
          restore-keys: cliff-images-

      - name: Vérifier les types
        run: npm run check

      # Les erreurs de logique et les seuils de complexité (eslint.config.js).
      # Les avertissements restent visibles sans arrêter la vérification.
      - name: Contrôler le code
        run: npm run lint

      # Les fonctions pures (dates, générique, typographie, données
      # structurées) et les loaders contre le faux Directus : sans le CMS.
      - name: Tests unitaires
        run: npm test

      - name: Construire le site
        run: npm run build

      # Les règles que seul le rendu final trahit : tirets longs, titres et
      # descriptions en double, canonical, données structurées.
      - name: Contrôler le site construit
        run: npm run test:dist
