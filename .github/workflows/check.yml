# Vérification du site, sans le publier.
#
# À chaque poussée sur dev, le même build que le déploiement : une erreur
# de type, un loader qui refuse, une page qui ne se rend pas se voient ici,
# avant le fast-forward vers main, et non au moment de mettre en ligne. Pas
# de déclencheur pull_request : le flux ne passe pas par des PR (dev → main
# en fast-forward direct), ça doublerait juste le run pour rien.
# Rien n'est écrit nulle part : ni FTP, ni date dans le CMS.
#
# Le cache des images est lu mais jamais réécrit (actions/cache/restore) :
# la clé cliff-images-<run> est celle du déploiement, qui a la version la
# plus récente ; un build de vérification n'a pas à la remplacer.

name: Vérification

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Brussels
      SITE_URL: ${{ vars.SITE_URL }}
      DIRECTUS_URL: ${{ vars.DIRECTUS_URL }}
      DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
      PRODYSOS_URL: ${{ vars.PRODYSOS_URL }}
      PRODYSOS_KEY: ${{ secrets.PRODYSOS_KEY }}
      PRODYSOS_COMPANY: ${{ vars.PRODYSOS_COMPANY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/directus-assets
            node_modules/.astro
          key: cliff-images-verification
          restore-keys: cliff-images-

      - name: Vérifier les types
        run: npm run check

      # Les fonctions pures (dates, générique, typographie, données
      # structurées) et les loaders contre le faux Directus : sans le CMS.
      - name: Tests unitaires
        run: npm test

      - name: Construire le site
        run: npm run build

      # Les règles que seul le rendu final trahit : tirets longs, titres et
      # descriptions en double, canonical, données structurées.
      - name: Contrôler le site construit
        run: npm run test:dist
