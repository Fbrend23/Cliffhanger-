# Déploiement du site de la Compagnie Cliffhanger (repris du portfolio).
#
# Un seul job : build, puis publication FTP vers l'hébergement Infomaniak par
# manifeste (scripts/deployer.mjs, scripts/lib/deploiement.mjs). Aucune pièce
# intermédiaire, donc aucun endroit où la chaîne puisse s'arrêter sans que
# personne ne l'apprenne.
#
# Trois déclencheurs :
#   push (main)         → un changement de code
#   workflow_dispatch   → relance manuelle, et bouton « Mettre en ligne »
#                         du CMS, posé sur cliff_publication
#   schedule (nuit)     → les dates passent, le site doit suivre : une
#                         représentation jouée quitte « À venir » sans clic
#
# Le site ne lit le CMS qu'ici. Un spectacle publié dans le Studio n'est en
# ligne qu'après ce job : c'est le bouton qui le lance.
#
# Garde-fou de déploiement : un fichier vide, NOMMÉ D'APRÈS CE SITE, doit
# exister à la racine du compte FTP, déposé une fois à la main. Son nom est la
# variable DEPLOY_MARKER. Si les secrets pointent ailleurs, le marqueur n'y est
# pas et tout s'arrête AVANT la moindre écriture : le FTP n'a pas de corbeille.
#
# PREMIER DÉPLOIEMENT : lancer à la main avec dry_run activé, puis lire la
# liste. Elle ne doit rien montrer qui ressemble à un autre site.

name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'aperçu des fichiers à envoyer et à supprimer, aucune écriture côté serveur'
        type: boolean
        default: false
  # Reconstruction nocturne, à 3 h UTC (4 h ou 5 h à Bruxelles) : une
  # représentation passée doit sortir de « À venir » même si personne n'a
  # rien publié ce jour-là.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: deploiement
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployer:
    runs-on: ubuntu-latest
    # Sans plafond, un job bloqué court jusqu'à la limite de six heures de
    # GitHub sans rien dire. Vingt minutes couvrent largement le cas normal,
    # deux à trois minutes, et transforment un blocage en échec signalé.
    timeout-minutes: 20
    env:
      # Le runner tourne en UTC : la date du jour, qui range l'agenda, est
      # celle de Bruxelles (le site la calcule aussi dans ce fuseau).
      TZ: Europe/Brussels
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      # 0 · Un build privé de ses sources doit s'arrêter avec un message qui
      #     dit ce qui manque, plutôt que de laisser une erreur d'Astro le
      #     faire à sa place.
      - name: Refuser un build sans ses sources
        run: |
          manquantes=""
          for v in DIRECTUS_URL DIRECTUS_TOKEN PRODYSOS_URL PRODYSOS_KEY PRODYSOS_COMPANY SITE_URL DEPLOY_MARKER; do
            if [ -z "${!v:-}" ]; then
              manquantes="$manquantes $v"
            fi
          done
          if [ -n "$manquantes" ]; then
            echo "::error::Sources absentes :$manquantes"
            echo "DIRECTUS_TOKEN est un secret du dépôt, déposé par platform-cms (npm run app-user)."
            echo "PRODYSOS_KEY est un secret : la clé publiable de Supabase, celle de Prodysos."
            echo "DIRECTUS_URL, PRODYSOS_URL, PRODYSOS_COMPANY, SITE_URL et DEPLOY_MARKER sont des variables (Settings > Variables)."
            echo "DEPLOY_MARKER nomme le fichier témoin déposé à la racine du compte FTP de CE site."
            exit 1
          fi
          echo "Les sept sources sont fournies."
        env:
          DIRECTUS_URL: ${{ vars.DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
          PRODYSOS_URL: ${{ vars.PRODYSOS_URL }}
          PRODYSOS_KEY: ${{ secrets.PRODYSOS_KEY }}
          PRODYSOS_COMPANY: ${{ vars.PRODYSOS_COMPANY }}
          SITE_URL: ${{ vars.SITE_URL }}
          DEPLOY_MARKER: ${{ vars.DEPLOY_MARKER }}

      # Les originaux rapatriés du CMS et les tailles que sharp en a tirées.
      # Un rebuild sans photo nouvelle ne retélécharge ni ne recalcule rien :
      # le manifeste compare les dates de modification, et astro:assets
      # retrouve ses dérivés. La clé change à chaque run pour que le cache
      # soit toujours réécrit avec l'état le plus récent ; restore-keys
      # retrouve le précédent.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/directus-assets
            node_modules/.astro
          key: cliff-images-${{ github.run_id }}
          restore-keys: cliff-images-

      # apt-get update rafraîchit TOUS les index de paquets pour installer un
      # seul binaire. On tente d'abord sans, et on ne rafraîchit que si l'index
      # du runner est trop vieux pour connaître lftp.
      - name: Installer lftp
        run: |
          sudo apt-get install -y -qq lftp \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq lftp; }

      # 1 · Garde-fou AVANT TOUT : la cible doit porter SON marqueur. Un simple
      #     listage, aucune écriture : le placer ici sépare « ta cible est
      #     fausse » de « ton contenu manque ».
      - name: Vérifier la cible de déploiement
        env:
          DEPLOY_MARKER: ${{ vars.DEPLOY_MARKER }}
        run: |
          if ! racine=$(lftp -u "$FTP_USER,$FTP_PASSWORD" \
            -e "set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 5; set dns:fatal-timeout 20; set ftp:ssl-force yes; set cmd:fail-exit yes; cls -l; quit" \
            "$FTP_HOST" 2>&1); then
            echo "::error::Connexion FTP impossible. Le marqueur n'est pas en cause."
            echo "$racine" | sed -E 's#(ftps?|sftp)://[^[:space:]]*@#\1://***@#g'
            echo "FTP_HOST doit être le serveur FTP de l'hébergeur, pas le domaine du site."
            exit 1
          fi

          echo "Connexion établie. Racine vue par ce compte FTP :"
          echo "$racine" | sed -E 's#(ftps?|sftp)://[^[:space:]]*@#\1://***@#g'

          if ! echo "$racine" | grep -qF " $DEPLOY_MARKER"; then
            echo "::error::Marqueur « $DEPLOY_MARKER » absent de cette racine, abandon."
            echo "Vérifier D'ABORD que le listage ci-dessus est bien CE site : c'est là"
            echo "que « Déployer » écrira. Puis y déposer un fichier vide nommé « $DEPLOY_MARKER »."
            exit 1
          fi

          echo "Marqueur « $DEPLOY_MARKER » présent, la cible est la bonne."

      # 2 · Tests, puis build. Séquentiel : pas de publication si l'un ou
      #     l'autre échoue, donc le site en ligne reste celui d'hier quand le
      #     CMS est injoignable ou qu'il ne rend aucune photo.
      # Les tests tournent dans le fuseau du job (Bruxelles) puis en UTC :
      # le formatage des dates doit donner le même résultat dans les deux.
      - name: Tests unitaires
        run: npm test

      - name: Tests unitaires (runner en UTC)
        run: npm test
        env:
          TZ: UTC

      - name: Construire le site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DIRECTUS_URL: ${{ vars.DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
          PRODYSOS_URL: ${{ vars.PRODYSOS_URL }}
          PRODYSOS_KEY: ${{ secrets.PRODYSOS_KEY }}
          PRODYSOS_COMPANY: ${{ vars.PRODYSOS_COMPANY }}
        run: npm run build

      # 3 · Publication par manifeste (scripts/deployer.mjs), plutôt qu'un
      #     mirror complet. Un mirror liste le serveur avant de comparer :
      #     une connexion FTP par dossier listé ET par fichier envoyé, plus
      #     de deux cents pour ce site. Passé un certain nombre, l'hébergeur
      #     en bloquait la moitié une minute.
      #
      #     Le manifeste du déploiement PRÉCÉDENT (UN fichier, jamais un
      #     listage) dit ce qui a changé : quelques fichiers la nuit,
      #     quelques dizaines après un déploiement de code. Rien n'est
      #     effacé avant d'être renvoyé (chaque chemin part en `put` direct),
      #     le site en ligne n'a donc jamais de page ou de style manquant
      #     pendant l'envoi. /_astro/ part en premier (dossiers-a-creer.txt
      #     et envoyer.txt le mettent avant le reste) : une page ne
      #     référence jamais un fichier qui n'existe pas encore. Ce qui a
      #     disparu, dossiers vidés compris, part en dernier.
      #
      #     Le manifeste ne connaît que dist/ : ni le marqueur, ni
      #     .user.ini, ni les pages de maintenance de l'hébergeur, qui ne
      #     risquent donc plus d'être touchés par erreur.
      - name: Déployer
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/deploiement"
          mkdir -p "$D"

          # Toujours un script (-f), jamais -e avec un site en argument : lftp
          # refuse de les combiner (« -c, -f, -v, -h conflict with other
          # `open' options and arguments »). La connexion est donc ouverte
          # depuis l'INTÉRIEUR de chaque script, en sa première ligne.
          #
          # lftp imprime des URL contenant le mot de passe, encodé en URL. La
          # chaîne encodée ne correspondant plus au secret, GitHub ne la
          # masque pas : on rédige nous-mêmes avant que ça n'atteigne les
          # logs. Toujours vers un fichier, jamais dans un pipe : sous
          # `set -o pipefail`, un sed en bout de pipe qui réussit masquerait
          # un lftp qui échoue. `|| statut=$?` : sous `set -e`, un lftp qui
          # échoue arrêtait le script à cette ligne même, avant que le sed
          # suivant n'ait jamais affiché le journal ; l'échec restait muet.
          lftp_go() {
            local statut=0
            lftp -f "$1" > "$D/sortie.log" 2>&1 || statut=$?
            sed -E 's#(ftps?|sftp)://[^[:space:]]*@#\1://***@#g' "$D/sortie.log"
            return $statut
          }
          ouvrir="open -u \"$FTP_USER,$FTP_PASSWORD\" \"$FTP_HOST\""
          parametres="set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 5; set dns:fatal-timeout 20; set ftp:ssl-force yes"

          node scripts/deployer.mjs construire dist "$D/nouveau.json"

          # Le manifeste du déploiement précédent : absent au premier
          # déploiement sous ce système, ou après l'avoir supprimé à la main
          # pour forcer un envoi complet. fail-exit no : un fichier absent
          # n'est pas une erreur, ancien.json restera vide.
          printf '%s\n%s\nset cmd:fail-exit no\nget .deploy-manifest.json -o "%s/ancien.json"\nquit\n' "$ouvrir" "$parametres" "$D" > "$D/get-ancien.lftp"
          lftp_go "$D/get-ancien.lftp" || true
          [ -s "$D/ancien.json" ] || : > "$D/ancien.json"

          node scripts/deployer.mjs diff "$D/ancien.json" "$D/nouveau.json" "$D"

          if [ -n "$DRY_RUN" ]; then
            echo "Aperçu, rien n'est écrit."
            echo "--- à envoyer ---"; cat "$D/envoyer.txt"
            echo "--- à supprimer ---"; cat "$D/supprimer.txt"
            echo "--- dossiers vidés ---"; cat "$D/dossiers-a-supprimer.txt"
            exit 0
          fi

          # Un seul script lftp, une seule connexion.
          script="$D/script.lftp"
          {
            echo "$ouvrir"
            echo "$parametres; set cmd:fail-exit yes;"
            sed 's/.*/mkdir -p "&"/' "$D/dossiers-a-creer.txt"
            sed 's#.*#put "dist/&" -o "&"#' "$D/envoyer.txt"
            sed 's/.*/rm "&"/' "$D/supprimer.txt"
            sed 's/.*/rmdir "&"/' "$D/dossiers-a-supprimer.txt"
            echo "put \"$D/nouveau.json\" -o .deploy-manifest.json"
            echo quit
          } > "$script"

          lftp_go "$script"

      # 4 · Dater la publication dans le CMS, une fois le site vraiment en
      #     ligne. Un échec ici ne casse pas le run : le site EST publié, et
      #     laisser la date en retard est moins faux que de déclarer le
      #     contraire. La policy du build autorise cette seule écriture.
      - name: Dater la publication dans le CMS
        if: ${{ success() && !inputs.dry_run }}
        env:
          DIRECTUS_URL: ${{ vars.DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
        run: |
          maintenant=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl -s -o reponse.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $DIRECTUS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"last_published\":\"$maintenant\"}" \
            "$DIRECTUS_URL/items/cliff_publication")

          if [ "$code" = "200" ]; then
            echo "CMS daté : $maintenant"
          else
            echo "::warning::Le CMS n'a pas accepté la date (HTTP $code). Le site est en ligne."
            sed -E 's/[A-Za-z0-9_-]{20,}/***/g' reponse.json | head -c 300
          fi
          rm -f reponse.json
